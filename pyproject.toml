[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aislopfixer"
version = "0.7.0"
description = "Terminal TUI that measures how templated a web project's design is, and rewrites it onto a system of its own"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mertsoylu" }]
keywords = ["ai", "slop", "design", "design-system", "tailwind", "tui", "textual"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["textual>=0.80"]

[project.urls]
Homepage = "https://github.com/MertSoylu/aislopfixer"
Repository = "https://github.com/MertSoylu/aislopfixer"
Issues = "https://github.com/MertSoylu/aislopfixer/issues"

[project.scripts]
aislopfixer = "aislopfixer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aislopfixer = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
